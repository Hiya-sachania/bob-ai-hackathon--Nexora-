submission:
  title: "TrialGuard: Clinical Trial Risk & Protocol Deviation Monitor"

  problem_statement: >
    Clinical trial risk managers struggle to detect protocol deviations such as missed visits,
    wrong dosing, and prohibited medications across many sites before they become serious
    compliance issues. They need a simple way to monitor site-level risk, identify high-risk
    sites early, and take corrective action before audits and regulatory reviews.

  solution_summary: >
    We built a Clinical Trial Risk Monitor that checks patient records against clinical trial
    protocols to detect missed visits, wrong dosing, and other protocol deviations. It
    classifies the severity of deviations, identifies high-risk sites, and provides clear
    risk insights and recommended actions to help risk managers take action before problems
    become serious.

  key_features:
    - "Finds problems like missed visits, wrong doses, and banned medicines"
    - "Shows how serious each problem is"
    - "Gives a risk score to each trial site"
    - "Shows high-risk sites clearly on a simple dashboard"
    - "Creates CAPA reports and allows data to be exported as CSV"

  tech_stack:
    languages: ["HTML", "CSS", "JavaScript"]
    frameworks: ["Vanilla JavaScript"]
    ibm_technologies: ["IBM Bob"]
    databases: ["In-memory synthetic dataset"]
    other: ["GitHub", "CSV Export", "CAPA Report Generation", "Web Browser"]

  what_we_are_most_proud_of: >
    We are most proud of our simple and practical risk monitoring dashboard that turns
    complex clinical trial data into clear site-level risk scores and protocol deviation
    alerts. It helps risk managers quickly identify high-risk sites, understand the reasons
    behind the risk, and take corrective action before issues become serious.

  known_limitations: >
    The project currently uses synthetic sample data instead of real clinical trial data.
    The risk detection and scoring are rule-based, and some advanced AI features and
    real-time database integration are not included yet. It is mainly a working prototype
    made to demonstrate the main idea.

