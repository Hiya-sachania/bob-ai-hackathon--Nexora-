submission:
  title: "TrialGuard: Clinical Trial Risk & Protocol Deviation Monitor"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
  Clinical trial risk managers struggle to detect protocol deviations such asmissed visits, wrong dosing,
  and prohibited medications across many sites before they become serious compliance issues. They need a simple way to
  monitor site-level risk, identify high-risk sites early, and take corrective action before audits and regulatory reviews.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
  We built an AI-powered Clinical Trial Risk Monitor that checks patient records against clinical trial protocols to detect
  missed visits, wrong dosing, and other protocol deviations. It classifies the severity of deviations, identifies
  high-risk sites, and provides clear risk insights and recommended actions to help risk managers take action before
  problems become serious.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Finds problems like missed visits, wrong doses, and banned medicines"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Shows how serious each problem is"
    - "Gives a risk score to each trial site"
    - "Shows high-risk sites clearly on a simple dashboard"                               # optional 4th
    - "Creates CAPA reports and allows data to be exported as CSV"                               # optional 5th

  tech_stack:
    languages: ["HTML", "CSS", "JavaScript"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["Vanilla JavaScript"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob", "IBM watsonx.ai"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["In-memory synthetic dataset"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["GitHub", "CSV Export", "CAPA Report Generation", "Web Browser"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
  We are most proud of our simple and practical risk monitoring dashboard that turns complex clinical trial data into clear
  site-level risk scores and protocol deviation alerts. It helps risk managers quickly identify high-risk sites, understand
  the reasons behind the risk, and take corrective action before issues become serious.

  known_limitations: >                 # Optional but recommended — be honest about gaps
  The project currently uses synthetic sample data instead of real clinical trial data. The risk detection and scoring are
  rule-based, and some advanced AI features and real-time database integration are not included yet. It is mainly a working
  prototype made to demonstrate the main idea.
