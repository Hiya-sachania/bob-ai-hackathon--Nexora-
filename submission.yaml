submission:
  title: "TrialGuard: Clinical Trial Risk & Protocol Deviation Monitor"
  problem_statement: "Clinical trial risk managers struggle to detect protocol deviations such as missed visits, wrong dosing, and prohibited medications across many sites before they become serious compliance issues."
  solution_summary: "We built a Clinical Trial Risk Monitor that checks patient records against clinical trial protocols to detect missed visits, wrong dosing, and other protocol deviations. It classifies deviations, identifies high-risk sites, and provides risk insights and recommended actions."
  key_features:
    - "Detects missed visits, wrong doses, and banned medicines"
    - "Shows deviation severity"
    - "Gives a risk score to each trial site"
    - "Shows high-risk sites on a dashboard"
    - "Creates CAPA reports and exports CSV data"
  tech_stack:
    languages: ["HTML", "CSS", "JavaScript"]
    frameworks: ["Vanilla JavaScript"]
    ibm_technologies: ["IBM Bob"]
    databases: ["In-memory synthetic dataset"]
    other: ["GitHub", "CSV Export", "CAPA Report Generation", "Web Browser"]
  what_we_are_most_proud_of: "We are most proud of our simple risk monitoring dashboard that turns clinical trial data into clear site-level risk scores and protocol deviation alerts."
  known_limitations: "The project currently uses synthetic sample data. Risk detection and scoring are rule-based, and advanced AI features and real-time database integration are not included yet."

